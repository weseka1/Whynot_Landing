# =============================================================================
# Render — Blueprint config (Infrastructure as Code)
# Docs: https://render.com/docs/blueprint-spec
#
# Con este archivo, Render configura el servicio automáticamente al detectar
# el repo. NO hace falta tocar settings en el dashboard.
# =============================================================================
services:
  - type: web
    name: whynot-landing
    runtime: static
    repo: https://github.com/yamilpintos/Whynot_Landing
    branch: main

    # Build: Next.js export estático → genera /out
    buildCommand: npm ci && npm run build

    # Publish directory (Next.js export sale a /out, no /dist)
    staticPublishPath: ./out

    headers:
      # ------------------------------------------------------------------
      # CACHING — assets inmutables 1 año; HTML revalidate per-deploy.
      # ------------------------------------------------------------------
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /dich-assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /nuves/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /videos-360/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # HTML: revalidate por deploy.
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate

      # ------------------------------------------------------------------
      # SECURITY HEADERS — defensa en profundidad a nivel host.
      # Estos no se pueden poner desde Next con output:"export"; van aca.
      # ------------------------------------------------------------------
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: same-site
      - path: /*
        name: X-DNS-Prefetch-Control
        value: "on"

    # Rewrite: fallback de paths para SPA (trailing slash routing)
    routes:
      - type: rewrite
        source: /:path*
        destination: /:path*/

    pullRequestPreviewsEnabled: false
