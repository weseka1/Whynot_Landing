# =============================================================================
# Render — Blueprint config (Infrastructure as Code)
# Docs: https://render.com/docs/blueprint-spec
#
# Con este archivo, Render configura el servicio automáticamente al detectar
# el repo. NO hace falta tocar settings en el dashboard.
# =============================================================================
services:
  - type: web
    name: whynot-landing
    runtime: static
    repo: https://github.com/yamilpintos/Whynot_Landing
    branch: main

    # Build: Next.js export estático → genera /out
    buildCommand: npm ci && npm run build

    # Publish directory (Next.js export sale a /out, no /dist)
    staticPublishPath: ./out

    # Headers básicos para mejor performance
    headers:
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /dich-assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /nuves/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

    # Rewrite: fallback de paths para SPA (trailing slash routing)
    routes:
      - type: rewrite
        source: /:path*
        destination: /:path*/

    pullRequestPreviewsEnabled: false
